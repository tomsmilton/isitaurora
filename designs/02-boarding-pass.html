<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Is it Aurora? — Boarding passes</title>
<style>
  :root{
    --paper:#f3ead7; --paper2:#fbf5e8; --ink:#28231a; --ink2:#6b6150;
    --line:#d8caac; --perf:#c9b893; --stub:#efe4cd;
    --aurora:#0b6fb0; --aurora-soft:#dbeefb; --aurora-edge:#0b6fb0;
    --meridian:#9a6a14; --meridian-soft:#f4e6c8;
    --void:#c2342b; --good:#1f8a4c; --late:#b96b00;
    --foil:linear-gradient(100deg,#7fd1ff 0%,#0b6fb0 40%,#8fd6ff 60%,#0b6fb0 100%);
    --shadow:0 18px 36px -26px rgba(40,30,10,.55);
    --bg:#e6dcc3;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink)}
  body{
    font:15px/1.45 ui-rounded,"Segoe UI",system-ui,-apple-system,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased; padding:22px 16px 80px;
    background:
      radial-gradient(120% 70% at 50% -8%, #efe6cf 0%, var(--bg) 60%);
  }
  .mono{font-family:ui-monospace,"SF Mono",Menlo,Consolas,"DejaVu Sans Mono",monospace}
  .wrap{max-width:1040px;margin:0 auto}

  header.hero{
    display:flex; align-items:flex-end; gap:16px; flex-wrap:wrap;
    padding:6px 8px 18px;
  }
  .brand{flex:1 1 auto;min-width:240px}
  .brand h1{
    margin:0; font-size:30px; font-weight:900; letter-spacing:-.01em;
    color:var(--ink);
  }
  .brand h1 .q{color:var(--aurora)}
  .brand .sub{
    margin-top:5px; font-size:12.5px; letter-spacing:.16em; text-transform:uppercase;
    color:var(--ink2); font-weight:700;
  }
  .stampbox{
    text-align:right; font-size:11.5px; color:var(--ink2); letter-spacing:.03em;
    border-left:2px solid var(--perf); padding-left:14px;
  }
  .stampbox b{display:block; color:var(--ink); font-size:13.5px; font-weight:800; letter-spacing:.02em; margin-top:2px}
  .stampbox .live{color:var(--good); font-weight:800}

  .controls{display:flex; gap:10px; flex-wrap:wrap; padding:0 8px 18px}
  .seg{display:inline-flex; background:#fffaf0; border:1.5px solid var(--line);
       border-radius:11px; overflow:hidden; box-shadow:var(--shadow)}
  .seg button{
    appearance:none; border:0; background:#0000; color:var(--ink2);
    font:inherit; font-size:12px; font-weight:800; letter-spacing:.06em;
    padding:9px 14px; cursor:pointer;
  }
  .seg button+button{border-left:1.5px solid var(--line)}
  .seg button.on{background:var(--ink); color:var(--paper2)}
  .seg.aur button.on{background:var(--aurora)}

  .count{padding:0 8px 14px; font-size:12.5px; color:var(--ink2); letter-spacing:.04em}
  .count b{color:var(--ink)}

  .grid{
    display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:20px;
    padding:0 4px;
  }

  /* ---- ticket ---- */
  .ticket{
    position:relative; display:grid; grid-template-columns:1fr 168px;
    background:linear-gradient(180deg,var(--paper2),var(--paper));
    border:1.5px solid var(--line); border-radius:14px;
    box-shadow:var(--shadow); overflow:hidden;
  }
  .ticket.aurora{border-color:#bcd9ef}
  /* coloured left edge for aurora */
  .ticket.aurora::before{
    content:""; position:absolute; left:0; top:0; bottom:0; width:7px;
    background:var(--foil); background-size:200% 100%;
  }
  .main{padding:16px 18px 16px 22px; min-width:0}
  .ticket.meridian .main{padding-left:18px}

  .mhead{display:flex; align-items:center; gap:8px; justify-content:space-between}
  .pnr{font-size:11px; letter-spacing:.12em; color:var(--ink2)}
  .route-tag{
    font-size:10.5px; letter-spacing:.14em; text-transform:uppercase; font-weight:800;
    color:var(--ink2); background:#0000000a; border:1px solid var(--line);
    padding:3px 8px; border-radius:6px; white-space:nowrap;
  }
  .times{display:flex; align-items:baseline; gap:14px; margin:10px 0 2px; flex-wrap:wrap}
  .dep{font-size:38px; font-weight:900; line-height:1; letter-spacing:.01em; font-variant-numeric:tabular-nums}
  .arrow{font-size:20px; color:var(--ink2); font-weight:800}
  .arr{font-size:24px; font-weight:800; color:var(--ink2); line-height:1; font-variant-numeric:tabular-nums}
  .route{font-size:15px; font-weight:800; margin-top:9px}
  .route .from{color:var(--ink)} .route .to{color:var(--ink)}
  .route .mid{color:var(--ink2); font-weight:700; margin:0 5px}

  .status{display:inline-flex; align-items:center; gap:7px; margin-top:11px;
          font-size:12.5px; font-weight:800; letter-spacing:.02em}
  .status .dot{width:8px;height:8px;border-radius:50%}
  .s-good{color:var(--good)} .s-good .dot{background:var(--good)}
  .s-late{color:var(--late)} .s-late .dot{background:var(--late)}
  .s-pred{color:var(--ink2)} .s-pred .dot{background:var(--ink2)}
  .status small{color:var(--ink2); font-weight:700}

  /* ---- counterfoil ---- */
  .stub{
    position:relative; padding:16px 16px; background:var(--stub);
    border-left:2px dashed var(--perf);
    display:flex; flex-direction:column; gap:11px;
  }
  /* notch cut-outs */
  .stub::before,.stub::after{
    content:""; position:absolute; left:-9px; width:18px; height:18px; border-radius:50%;
    background:radial-gradient(circle at center, var(--bg) 0 8px, #0000 8px);
  }
  .stub::before{top:-9px}
  .stub::after{bottom:-9px}

  .badge{
    display:inline-flex; flex-direction:column; gap:2px; padding:9px 11px; border-radius:9px;
    border:1.5px solid; font-weight:900;
  }
  .badge .blab{font-size:10px; letter-spacing:.18em; text-transform:uppercase; font-weight:800; opacity:.8}
  .badge .bname{font-size:19px; line-height:1; letter-spacing:.01em}
  .badge .bclass{font-size:11px; font-weight:700; letter-spacing:.04em; opacity:.85}
  .b-810{background:var(--aurora-soft); color:var(--aurora); border-color:#a9d4ef}
  .b-222{background:var(--meridian-soft); color:var(--meridian); border-color:#e3c98e}
  .b-unknown{background:#0000000a; color:var(--ink2); border-color:var(--line)}

  .foilstrip{
    font-size:9.5px; letter-spacing:.32em; text-align:center; font-weight:900;
    color:#063a5e; background:var(--foil); background-size:200% 100%;
    border-radius:5px; padding:4px 0; margin-top:-3px;
    -webkit-background-clip:border-box;
  }

  .chips{display:flex; flex-wrap:wrap; gap:6px; margin-top:auto}
  .chip{
    font-size:11px; font-weight:700; color:var(--ink); background:#fffaf0;
    border:1px solid var(--line); border-radius:6px; padding:3px 8px;
    letter-spacing:.02em;
  }
  .chip b{color:var(--ink2); font-weight:700; font-size:9.5px; letter-spacing:.1em; text-transform:uppercase; margin-right:4px}
  .conf{font-size:10px; letter-spacing:.14em; text-transform:uppercase; font-weight:800; color:var(--ink2)}

  /* cancelled overprint */
  .ticket.canc{filter:saturate(.55)}
  .ticket.canc .dep,.ticket.canc .route{color:var(--ink2)}
  .void{
    position:absolute; inset:0; pointer-events:none; display:flex; align-items:center; justify-content:center;
    z-index:5;
  }
  .void span{
    transform:rotate(-12deg);
    border:4px solid var(--void); color:var(--void);
    font-size:30px; font-weight:900; letter-spacing:.18em; padding:6px 22px;
    border-radius:8px; background:rgba(255,250,240,.55);
    box-shadow:0 0 0 3px rgba(255,250,240,.4);
    text-transform:uppercase;
  }

  footer{max-width:1040px; margin:26px auto 0; text-align:center;
          font-size:11px; letter-spacing:.06em; color:var(--ink2)}

  @media(max-width:760px){
    .grid{grid-template-columns:1fr; gap:18px}
    .ticket{grid-template-columns:1fr 150px}
    .dep{font-size:34px}
    .stampbox{border-left:0; padding-left:0; text-align:left; flex:1 1 100%}
    header.hero{gap:10px}
  }
  @media(max-width:430px){
    .ticket{grid-template-columns:1fr}
    .stub{border-left:0; border-top:2px dashed var(--perf)}
    .stub::before{top:-9px; left:auto; right:50%; transform:translateX(50%);
      background:radial-gradient(circle at center, var(--bg) 0 8px, #0000 8px)}
    .stub::after{bottom:auto; top:-9px; left:-9px; right:auto; transform:none}
    .stub::before{left:-9px; right:auto; transform:none; top:-9px}
    .void span{font-size:24px}
  }

  @media(prefers-color-scheme:dark){
    :root{
      --bg:#0c0f14; --paper:#161b24; --paper2:#1b212c; --ink:#eef2f7; --ink2:#9aa6b6;
      --line:#2a3340; --perf:#3a4554; --stub:#141923;
      --aurora:#6cc4ff; --aurora-soft:#0f2a3e; --meridian:#e0b45a; --meridian-soft:#2c2310;
      --void:#ff6b60; --good:#54d488; --late:#ffb24d;
      --shadow:0 22px 48px -28px #000;
    }
    body{background:radial-gradient(120% 70% at 50% -8%, #131a26 0%, var(--bg) 60%)}
    .seg{background:#1a2029}
    .seg button.on{color:#0b0f14}
    .seg.aur button.on{color:#04121d}
    .route-tag{background:#ffffff0a}
    .chip{background:#1a212c}
    .b-810{border-color:#214a66} .b-222{border-color:#4a3b16} .b-unknown{border-color:var(--line)}
    .void span{background:rgba(20,24,32,.6); box-shadow:0 0 0 3px rgba(20,24,32,.4)}
    .stub::before,.stub::after{background:radial-gradient(circle at center, var(--bg) 0 8px, #0000 8px)}
    .foilstrip{color:#04121d}
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="hero">
    <div class="brand">
      <h1>Is it Aurora<span class="q">?</span></h1>
      <div class="sub">EMR · Sheffield ⇄ London St Pancras</div>
    </div>
    <div class="stampbox">
      <span class="live">●</span> LIVE BOARDING<br>
      DATA FROM <b id="stamp"></b>
    </div>
  </header>

  <div class="controls">
    <div class="seg" id="dateSeg">
      <button data-k="date" data-v="today" class="on">Today</button>
      <button data-k="date" data-v="tomorrow">Tomorrow</button>
    </div>
    <div class="seg aur" id="dirSeg">
      <button data-k="dir" data-v="toLondon" class="on">→ London</button>
      <button data-k="dir" data-v="toSheffield">→ Sheffield</button>
    </div>
    <div class="seg" id="stkSeg">
      <button data-k="stock" data-v="all" class="on">All</button>
      <button data-k="stock" data-v="810">Aurora</button>
      <button data-k="stock" data-v="222">Meridian</button>
    </div>
  </div>

  <div class="count" id="count"></div>
  <div class="grid" id="grid"></div>

  <footer>Boarding-pass mockup · sample data 19 Jun 2026 · Aurora = Class 810 electric, Meridian = Class 222 diesel</footer>
</div>

<script src="data.js"></script>
<script>
const state={date:"today",dir:"toLondon",stock:"all"};
const stockLabel=c=>c==="810"?"Aurora":c==="222"?"Meridian":"Unknown";
const stockClassName=c=>c==="810"?"AURORA · CL.810":c==="222"?"MERIDIAN · CL.222":"UNKNOWN STOCK";
function fmtStamp(iso){
  const d=new Date(iso);
  return d.toLocaleString("en-GB",{weekday:"short",day:"numeric",month:"short",hour:"2-digit",minute:"2-digit",timeZone:"UTC"});
}
function statusBlock(s){
  if(s.cancelled) return '';
  const late=s.arrivalLatenessMin ?? s.departureLatenessMin;
  if(s.actualDepartureTime==null && late==null)
    return `<div class="status s-pred"><span class="dot"></span>Scheduled <small>· predicted</small></div>`;
  if(late==null) return `<div class="status s-good"><span class="dot"></span>On time</div>`;
  if(late<=0) return `<div class="status s-good"><span class="dot"></span>On time${late<0?` <small>· ${Math.abs(late)}m early</small>`:''}</div>`;
  return `<div class="status s-late"><span class="dot"></span>+${late} min late <small>· exp ${s.actualArrivalTime??s.arrivalTime}</small></div>`;
}
function ticket(s){
  const cls=s.stockClass;
  const flavour=cls==="810"?"aurora":cls==="222"?"meridian":"unknown";
  const chips=[];
  if(s.platform) chips.push(`<span class="chip"><b>Plat</b>${s.platform}</span>`);
  if(s.numberOfVehicles) chips.push(`<span class="chip"><b>Coach</b>${s.numberOfVehicles}</span>`);
  if(s.unitNumber) chips.push(`<span class="chip"><b>Unit</b>${s.unitNumber}</span>`);
  chips.push(`<span class="chip conf">${s.confidence}</span>`);
  const fromTo=`${s.origin.replace(" International","")} <span class="mid">→</span> ${s.destination.replace(" International","")}`;
  const foil = cls==="810" ? `<div class="foilstrip">▸ AURORA ELECTRIC ◂</div>` : '';
  return `<article class="ticket ${flavour} ${s.cancelled?'canc':''}">
    <div class="main">
      <div class="mhead">
        <span class="pnr mono">№ ${s.serviceUid}</span>
        <span class="route-tag">EMR · East Midlands</span>
      </div>
      <div class="times">
        <span class="dep mono">${s.departureTime}</span>
        <span class="arrow">→</span>
        <span class="arr mono">${s.arrivalTime}</span>
      </div>
      <div class="route">${fromTo}</div>
      ${statusBlock(s)}
    </div>
    <aside class="stub">
      <span class="badge b-${cls}">
        <span class="blab">${cls==="unknown"?"Stock":"Class "+cls}</span>
        <span class="bname">${stockLabel(cls)}</span>
        <span class="bclass">${cls==="810"?"Electric":cls==="222"?"Diesel":"Unconfirmed"}</span>
      </span>
      ${foil}
      <div class="chips">${chips.join("")}</div>
    </aside>
    ${s.cancelled?`<div class="void"><span>Cancelled</span></div>`:''}
  </article>`;
}
function render(){
  document.getElementById("stamp").textContent=fmtStamp(EMR.generatedAt);
  let rows=EMR[state.date][state.dir];
  if(state.stock!=="all") rows=rows.filter(s=>s.stockClass===state.stock);
  const dayLabel=state.date==="today"?"today":"tomorrow";
  const dirLabel=state.dir==="toLondon"?"to London":"to Sheffield";
  const aur=rows.filter(s=>s.stockClass==="810").length;
  document.getElementById("count").innerHTML=
    `Showing <b>${rows.length}</b> service${rows.length===1?'':'s'} ${dirLabel} · <b>${dayLabel}</b> · <b>${aur}</b> Aurora`;
  const grid=document.getElementById("grid");
  if(!rows.length){grid.innerHTML=`<div class="count" style="grid-column:1/-1">No services match — likely engineering works.</div>`;return;}
  grid.innerHTML=rows.map(ticket).join("");
}
document.querySelectorAll(".seg button").forEach(b=>b.addEventListener("click",()=>{
  const k=b.dataset.k;state[k]=b.dataset.v;
  b.parentNode.querySelectorAll("button").forEach(x=>x.classList.remove("on"));
  b.classList.add("on");render();
}));
render();
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Is it Aurora? — Departure board</title>
<style>
  :root{
    --board:#0b0f0a; --board2:#11160f; --rail:#1c241a;
    --amber:#ffb000; --amber-dim:#a06b00; --cream:#f4ead1;
    --green:#3ddc6a; --red:#ff5a52; --muted:#8a9580; --line:#222b1d;
    --aurora:#7fd1ff; --meridian:#c9a227;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:#05060a;color:var(--cream)}
  body{
    font:14px/1.4 ui-monospace,"SF Mono",Menlo,Consolas,"DejaVu Sans Mono",monospace;
    padding:18px 14px 70px; -webkit-font-smoothing:antialiased;
    background:radial-gradient(120% 80% at 50% -10%,#0d130c 0%,#05060a 70%);
  }
  .wrap{max-width:980px;margin:0 auto}
  .marquee{
    border:1px solid var(--line); border-radius:12px; overflow:hidden;
    background:linear-gradient(180deg,var(--board) 0%,var(--board2) 100%);
    box-shadow:0 20px 60px -30px #000, inset 0 1px 0 #ffffff0a;
  }
  .top{
    display:flex; align-items:center; gap:14px; flex-wrap:wrap;
    padding:16px 18px; border-bottom:1px solid var(--line);
    background:repeating-linear-gradient(90deg,#0000 0 6px,#ffffff05 6px 7px);
  }
  .sign{
    font-weight:800; letter-spacing:.18em; font-size:18px;
    color:var(--amber); text-shadow:0 0 14px #ffb00055;
  }
  .sign small{display:block;font-size:10px;letter-spacing:.32em;color:var(--muted);font-weight:600;margin-top:3px}
  .stamp{margin-left:auto;text-align:right;font-size:11px;color:var(--muted);letter-spacing:.04em}
  .stamp b{color:var(--cream);font-weight:600}
  .stamp .live{color:var(--green)}
  .controls{display:flex;gap:8px;flex-wrap:wrap;padding:12px 18px;border-bottom:1px solid var(--line)}
  .seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
  .seg button{
    appearance:none;border:0;background:#0000;color:var(--muted);
    font:inherit;font-size:11px;letter-spacing:.12em;text-transform:uppercase;
    padding:7px 12px;cursor:pointer
  }
  .seg button+button{border-left:1px solid var(--line)}
  .seg button.on{background:var(--amber);color:#1a1200;font-weight:700}
  .legend{display:flex;gap:16px;flex-wrap:wrap;padding:10px 18px;font-size:11px;color:var(--muted);border-bottom:1px solid var(--line);letter-spacing:.05em}
  .legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:6px;vertical-align:middle}
  .i-aurora{background:var(--aurora);box-shadow:0 0 8px var(--aurora)}
  .i-meridian{background:var(--meridian)}
  .i-unknown{background:#3a463016;border:1px solid var(--line)}

  .head,.row{
    display:grid; grid-template-columns:64px 1fr 52px 132px 120px; gap:10px;
    align-items:center; padding:11px 18px;
  }
  .head{
    color:var(--amber-dim); font-size:10px; letter-spacing:.22em; text-transform:uppercase;
    border-bottom:1px solid var(--line);
  }
  .row{border-bottom:1px solid #ffffff07}
  .row:nth-child(odd){background:#ffffff04}
  .time{font-size:18px;font-weight:700;color:var(--cream);letter-spacing:.02em;font-variant-numeric:tabular-nums}
  .dest .to{font-size:14px;color:var(--cream)}
  .dest .via{font-size:10px;color:var(--muted);letter-spacing:.04em;margin-top:2px}
  .plat{font-variant-numeric:tabular-nums;color:var(--amber);font-weight:700;text-align:center}
  .plat small{display:block;font-size:9px;color:var(--muted);font-weight:500;letter-spacing:.1em}
  .badge{
    display:inline-flex;align-items:center;gap:7px;padding:5px 9px;border-radius:7px;
    font-size:12px;font-weight:700;letter-spacing:.04em;border:1px solid #0000;white-space:nowrap;
  }
  .badge .dot{width:8px;height:8px;border-radius:50%}
  .b-810{background:#0e2436;color:var(--aurora);border-color:#1d4a66}
  .b-810 .dot{background:var(--aurora);box-shadow:0 0 10px var(--aurora)}
  .b-222{background:#241f0c;color:var(--meridian);border-color:#4a3f12}
  .b-222 .dot{background:var(--meridian)}
  .b-unknown{background:#171c12;color:var(--muted);border-color:var(--line)}
  .b-unknown .dot{background:var(--muted)}
  .conf{font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-top:4px;display:block}
  .status{text-align:right;font-weight:700;font-size:13px;letter-spacing:.03em;font-variant-numeric:tabular-nums}
  .s-ontime{color:var(--green)}
  .s-late{color:var(--amber)}
  .s-canc{color:var(--red);letter-spacing:.1em}
  .status small{display:block;font-size:10px;color:var(--muted);font-weight:500;letter-spacing:.04em;margin-top:2px}
  .chips{margin-top:5px;font-size:10px;color:var(--muted);letter-spacing:.04em}
  .row.canc .time,.row.canc .dest .to{color:#6f6a5a;text-decoration:line-through}
  .empty{padding:40px 18px;text-align:center;color:var(--muted)}
  footer{max-width:980px;margin:14px auto 0;color:#5c6552;font-size:10px;letter-spacing:.06em;text-align:center}
  @media(max-width:620px){
    .head{display:none}
    .row{grid-template-columns:54px 1fr;grid-template-areas:"time dest" "time meta";row-gap:4px;padding:12px 14px}
    .time{grid-area:time;align-self:start}
    .dest{grid-area:dest}
    .plat{display:none}
    .row .badge{grid-area:meta;justify-self:start;margin-top:4px}
    .status{grid-area:meta;justify-self:end;align-self:center}
    .top,.controls,.legend{padding-left:14px;padding-right:14px}
  }
  @media(prefers-color-scheme:light){
    html,body{background:#e9ebe4;color:#1a1d16}
    body{background:radial-gradient(120% 80% at 50% -10%,#f2f3ec,#e3e6dd)}
    :root{--board:#15190f;--board2:#1b2014;--line:#2a331f;--muted:#9aa48c}
    footer{color:#7a836e}
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="marquee">
    <div class="top">
      <div class="sign">IS IT AURORA?<small>EMR · SHEFFIELD ⇄ ST PANCRAS</small></div>
      <div class="stamp">DEPARTURES · <span id="dayName"></span><br><span class="live">●</span> DATA FROM <b id="stamp"></b></div>
    </div>
    <div class="controls">
      <div class="seg" id="dateSeg">
        <button data-k="date" data-v="today" class="on">Today</button>
        <button data-k="date" data-v="tomorrow">Tomorrow</button>
      </div>
      <div class="seg" id="dirSeg">
        <button data-k="dir" data-v="toLondon" class="on">→ London</button>
        <button data-k="dir" data-v="toSheffield">→ Sheffield</button>
      </div>
      <div class="seg" id="stkSeg">
        <button data-k="stock" data-v="all" class="on">All</button>
        <button data-k="stock" data-v="810">Aurora</button>
        <button data-k="stock" data-v="222">Meridian</button>
      </div>
    </div>
    <div class="legend">
      <span><i class="i-aurora"></i>Class 810 Aurora — electric</span>
      <span><i class="i-meridian"></i>Class 222 Meridian — diesel</span>
      <span><i class="i-unknown"></i>Unconfirmed</span>
    </div>
    <div class="head">
      <span>Time</span><span>Destination</span><span>Plat</span><span>Stock</span><span style="text-align:right">Status</span>
    </div>
    <div id="board"></div>
  </div>
  <footer>SOLARI BOARD MOCKUP · DATA: REALTIME TRAINS · SAMPLE 19 JUN 2026</footer>
</div>
<script src="data.js"></script>
<script>
const state={date:"today",dir:"toLondon",stock:"all"};
const stockLabel=c=>c==="810"?"Aurora":c==="222"?"Meridian":"Unknown";
function fmtStamp(iso){
  const d=new Date(iso);
  return d.toLocaleString("en-GB",{weekday:"short",day:"numeric",month:"short",hour:"2-digit",minute:"2-digit",timeZone:"UTC"});
}
function dayName(key){
  const d=new Date(EMR[key].date+"T00:00:00Z");
  return (key==="today"?"TODAY · ":"TOMORROW · ")+d.toLocaleDateString("en-GB",{weekday:"long",day:"numeric",month:"long",timeZone:"UTC"}).toUpperCase();
}
function statusCell(s){
  if(s.cancelled) return `<div class="status s-canc">CANCELLED</div>`;
  const late=s.arrivalLatenessMin ?? s.departureLatenessMin;
  if(s.actualDepartureTime==null && late==null)
    return `<div class="status"><span style="color:var(--muted)">On time</span><small>expected</small></div>`;
  if(late==null) return `<div class="status s-ontime">On time</div>`;
  if(late<=0) return `<div class="status s-ontime">On time${late<0?` <small>${late}m early</small>`:''}</div>`;
  return `<div class="status s-late">+${late} min<small>exp ${s.actualArrivalTime??s.arrivalTime}</small></div>`;
}
function render(){
  document.getElementById("stamp").textContent=fmtStamp(EMR.generatedAt);
  document.getElementById("dayName").textContent=dayName(state.date);
  let rows=EMR[state.date][state.dir];
  if(state.stock!=="all") rows=rows.filter(s=>s.stockClass===state.stock);
  const board=document.getElementById("board");
  if(!rows.length){board.innerHTML=`<div class="empty">No services match — likely engineering works.</div>`;return;}
  board.innerHTML=rows.map(s=>{
    const chips=[];
    if(s.numberOfVehicles) chips.push(s.numberOfVehicles+" coach");
    if(s.unitNumber) chips.push("unit "+s.unitNumber);
    const via=s.origin.replace(" International","")+" → "+s.destination.replace(" International","");
    return `<div class="row ${s.cancelled?'canc':''}">
      <div class="time">${s.departureTime}<small style="display:block;font-size:9px;color:var(--muted);font-weight:500">arr ${s.arrivalTime}</small></div>
      <div class="dest"><div class="to">${via}</div>${chips.length?`<div class="chips">${chips.join(' · ')}</div>`:''}</div>
      <div class="plat">${s.platform?s.platform:'—'}<small>plat</small></div>
      <div><span class="badge b-${s.stockClass}"><span class="dot"></span>${stockLabel(s.stockClass)}</span><span class="conf">${s.confidence}</span></div>
      ${statusCell(s)}
    </div>`;
  }).join("");
}
document.querySelectorAll(".seg button").forEach(b=>b.addEventListener("click",()=>{
  const k=b.dataset.k;state[k]=b.dataset.v;
  b.parentNode.querySelectorAll("button").forEach(x=>x.classList.remove("on"));
  b.classList.add("on");render();
}));
render();
</script>
</body>
</html>
